name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        pip install flake8
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with coverage
      run: |
        cd backend
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
    
    - name: Check coverage threshold
      run: |
        cd backend
        coverage report --fail-under=70
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/todotaskmanager:latest -f Dockerfile backend/
        docker push ${{ secrets.DOCKER_USERNAME }}/todotaskmanager:latest
    
    - name: Test Docker image
      run: |
        docker run -d -p 5000:5000 --name test-container ${{ secrets.DOCKER_USERNAME }}/todotaskmanager:latest
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker stop test-container
        docker rm test-container

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Deploy to Azure Container Instances  
      run: |
        CONTAINER_NAME="todotaskmanager-erivela21"
        RESOURCE_GROUP="BCSAI2025-DEVOPS-STUDENTS-B"
        LOCATION="northeurope"
        IMAGE="${{ secrets.DOCKER_USERNAME }}/todotaskmanager:latest"
        
        echo "=========================================="
        echo "Deploying: $CONTAINER_NAME"
        echo "Resource Group: $RESOURCE_GROUP"
        echo "Image: $IMAGE"
        echo "=========================================="
        
        # Delete old container if exists
        if az container show -g $RESOURCE_GROUP -n $CONTAINER_NAME 2>/dev/null; then
          echo "Deleting old container..."
          az container delete -g $RESOURCE_GROUP -n $CONTAINER_NAME --yes
          sleep 10
        fi
        
        # Deploy actual Task Manager application
        echo "🚀 Creating container instance..."
        az container create \
          --resource-group $RESOURCE_GROUP \
          --name $CONTAINER_NAME \
          --image $IMAGE \
          --registry-username ${{ secrets.DOCKER_USERNAME }} \
          --registry-password ${{ secrets.DOCKER_PASSWORD }} \
          --os-type Linux \
          --cpu 1 \
          --memory 1 \
          --ports 5000 \
          --ip-address Public \
          --dns-name-label todotaskmanager-erivela21 \
          --location $LOCATION \
          --environment-variables \
            TASK_API_HOST=0.0.0.0 \
            TASK_API_PORT=5000 \
            FLASK_ENV=production \
          --restart-policy Always
        
        echo "✅ Container deployed successfully!"
    
    - name: Get deployment URL
      run: |
        RESOURCE_GROUP="BCSAI2025-DEVOPS-STUDENTS-B"
        FQDN=$(az container show \
          --resource-group $RESOURCE_GROUP \
          --name todotaskmanager-erivela21 \
          --query ipAddress.fqdn \
          --output tsv)
        echo "=========================================="
        echo "🚀 Application deployed successfully!"
        echo "URL: http://$FQDN:5000"
        echo "Health: http://$FQDN:5000/health"
        echo "=========================================="
        echo "DEPLOYMENT_URL=http://$FQDN:5000" >> $GITHUB_ENV
    
    - name: Verify deployment
      run: |
        echo "Checking container status..."
        sleep 10
        
        RESOURCE_GROUP="BCSAI2025-DEVOPS-STUDENTS-B"
        CONTAINER_STATE=$(az container show \
          --resource-group $RESOURCE_GROUP \
          --name todotaskmanager-erivela21 \
          --query instanceView.state \
          --output tsv)
        
        echo "Container state: $CONTAINER_STATE"
        
        FQDN=$(az container show \
          --resource-group $RESOURCE_GROUP \
          --name todotaskmanager-erivela21 \
          --query ipAddress.fqdn \
          --output tsv)
        
        echo "=========================================="
        echo "✅ Deployment completed!"
        echo "URL: http://$FQDN:5000"
        echo "Health: http://$FQDN:5000/health"
        echo "Tasks: http://$FQDN:5000/tasks"
        echo "Metrics: http://$FQDN:5000/metrics"
        echo "=========================================="
        echo ""
        echo "Note: Container may take 1-2 minutes to fully start."

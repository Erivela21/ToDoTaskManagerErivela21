name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd backend
        pip install -r requirements.txt
    
    - name: Run linting
      run: |
        pip install flake8
        cd backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Run tests with coverage
      run: |
        cd backend
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=term
    
    - name: Check coverage threshold
      run: |
        cd backend
        coverage report --fail-under=70
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker build -t task-manager-api:latest .
    
    - name: Test Docker image
      run: |
        docker run -d -p 5000:5000 --name test-container task-manager-api:latest
        sleep 5
        curl -f http://localhost:5000/health || exit 1
        docker stop test-container
        docker rm test-container

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Build and push Docker image
      run: |
        # Build the image
        docker build -t task-manager-backend:${{ github.sha }} .
        docker tag task-manager-backend:${{ github.sha }} task-manager-backend:latest
    
    - name: Deploy to Azure Container Instances
      run: |
        # Create unique container name with your GitHub username
        CONTAINER_NAME="task-manager-erivela21"
        RESOURCE_GROUP="sddo-shared-rg"  # Shared resource group for all students
        
        echo "Deploying to resource group: $RESOURCE_GROUP"
        
        # Deploy container to Azure
        az container create \
          --resource-group $RESOURCE_GROUP \
          --name $CONTAINER_NAME \
          --image task-manager-backend:latest \
          --cpu 1 \
          --memory 1 \
          --ports 5000 \
          --dns-name-label task-manager-erivela21 \
          --environment-variables \
            TASK_API_HOST=0.0.0.0 \
            TASK_API_PORT=5000 \
            FLASK_ENV=production \
          --restart-policy Always
    
    - name: Get deployment URL
      run: |
        RESOURCE_GROUP="sddo-shared-rg"
        
        FQDN=$(az container show \
          --resource-group $RESOURCE_GROUP \
          --name task-manager-erivela21 \
          --query ipAddress.fqdn \
          --output tsv)
        echo "🚀 Application deployed to: http://$FQDN:5000"
        echo "🏥 Health check: http://$FQDN:5000/health"
        echo "DEPLOYMENT_URL=http://$FQDN:5000" >> $GITHUB_ENV
    
    - name: Verify deployment
      run: |
        sleep 15
        RESOURCE_GROUP="sddo-shared-rg"
        
        FQDN=$(az container show \
          --resource-group $RESOURCE_GROUP \
          --name task-manager-erivela21 \
          --query ipAddress.fqdn \
          --output tsv)
        
        echo "Testing health endpoint at: http://$FQDN:5000/health"
        curl -f http://$FQDN:5000/health || exit 1
        echo "✅ Deployment verified successfully!"
